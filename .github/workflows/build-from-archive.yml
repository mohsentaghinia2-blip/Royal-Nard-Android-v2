
name: Build Royal Nard Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-archive.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/royalnard"
          python3 - "$ARCHIVE" "$RUNNER_TEMP/royalnard" <<'PY'
          import sys, zipfile
          from pathlib import PurePosixPath

          archive, destination = sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit("Unsafe ZIP path: " + name)
              z.extractall(destination)
          PY

          SRC="$RUNNER_TEMP/royalnard"

          test -f "$SRC/settings.gradle"
          test -f "$SRC/app/build.gradle"
          test -f "$SRC/app/src/main/AndroidManifest.xml"

          rsync -a "$SRC/" "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Nard-10.7-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
